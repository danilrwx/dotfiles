# Forward OSC 52 to the outer terminal so clip/vim yanks reach the host
# clipboard through tmux. Sourced from ~/.tmux.conf.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Mouse on: drag-select copies to the host clipboard (via OSC 52) on release.
set -g mouse on

# tmux < 3.2 has no terminal-features; use this instead of the line above:
# set -ag terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
