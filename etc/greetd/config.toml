# dotfiles: tuigreet on vt 7, sway (its package's /usr/share/wayland-sessions/sway.desktop; the sessions' directory
# named, Debian's tuigreet lists none unless told); remembering the last user and session
[terminal]
vt = 7

[default_session]
command = "tuigreet --time --remember --remember-session --asterisks --sessions /usr/share/wayland-sessions --cmd sway"
user = "_greetd"
