# dotfiles: tuigreet on vt 7, bspwm (bin/x-session through startx, as /usr/share/xsessions/x-bspwm.desktop
# runs it); remembering the last user and session
[terminal]
vt = 7

[default_session]
command = "tuigreet --time --remember --remember-session --asterisks --xsessions /usr/share/xsessions --cmd 'startx /home/danil/dotfiles/bin/x-session'"
user = "_greetd"
