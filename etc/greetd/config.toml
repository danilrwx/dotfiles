# dotfiles: tuigreet on vt 7, i3 by default, Hyprland beside it (F3 picks), remembering the last
# user and session
[terminal]
vt = 7

[default_session]
command = "tuigreet --time --remember --remember-session --asterisks --sessions /usr/share/wayland-sessions --xsessions /usr/share/xsessions --xsession-wrapper 'startx /usr/bin/env' --cmd 'startx /usr/bin/env i3'"
user = "_greetd"
