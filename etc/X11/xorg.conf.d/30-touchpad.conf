# install --desktop: the touchpad under X: no tap, a click by the fingers down, natural scrolling,
# off while typing, the slower pointer, scrolling at the driver's slowest (50 px of travel a step, against 15)
Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "off"
    Option "NaturalScrolling" "true"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "true"
    Option "AccelSpeed" "-0.25"
    Option "ScrollPixelDistance" "50"
EndSection
