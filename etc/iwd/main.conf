# dotfiles: iwd configures the address itself, DNS goes to systemd-resolved; the Intel card's power save off
[General]
EnableNetworkConfiguration=true

[Network]
NameResolvingService=systemd

[DriverQuirks]
# iwlwifi's power save drops the link now and then (a local deauth, reason 4) and WPA3 then fails to come back
PowerSaveDisable=iwlwifi
