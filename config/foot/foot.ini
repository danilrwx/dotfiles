include=~/.config/dotfiles/theme/foot.ini
shell=/usr/bin/bash --login
font=Fixedsys Excelsior:pixelsize=17.5:antialias=false,IosevkaTerm Nerd Font Mono:pixelsize=17.5
font-bold=Fixedsys Excelsior:pixelsize=17.5:antialias=false,IosevkaTerm Nerd Font Mono:pixelsize=17.5
font-bold-italic=Fixedsys Excelsior:pixelsize=17.5:antialias=false,IosevkaTerm Nerd Font Mono:pixelsize=17.5
# 0.375 pt = 0.5 px at 96 DPI (dpi-aware=no).
font-size-adjustment=0.375
dpi-aware=no
pad=10x10

[scrollback]
lines=10000

