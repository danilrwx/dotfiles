# foot, the terminal under sway (config/sway): one `foot --server` from bin/sway-autostart, a footclient
# per window. Font and colours as config/ghostty (themes/base).

[main]
font=Iosevka NF:size=12
pad=8x5
# servers rarely carry foot's own terminfo; less/vim/tmux there break with TERM=foot
term=xterm-256color

[bell]
urgent=no
notify=no

[colors]
foreground=ffffff
background=000000
selection-foreground=000000
selection-background=b5d5ff
regular0=000000
regular1=cd0000
regular2=00cd00
regular3=cdcd00
regular4=80a0ff
regular5=cd00cd
regular6=00cdcd
regular7=e5e5e5
bright0=7f7f7f
bright1=ff0000
bright2=00ff00
bright3=ffff00
bright4=5c5cff
bright5=ff00ff
bright6=00ffff
bright7=ffffff
