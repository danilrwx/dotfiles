# Bluetooth headsets stay in A2DP, stereo, when an app opens a mic: the mic is the built-in array (the HONOR
# fork's dmic-array), not the headset's, whose HFP turns everything into mono phone sound. The headset's own
# mic still works, picked by hand (bin/x-ctl headset). SBC-XQ, the better SBC, offered too. Linked to
# ~/.config/wireplumber by install.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
}
