; polybar, bspwm's bar (config/bspwm starts it): desktops left, bin/x-status and the tray
; right. Linked to ~/.config/polybar by install.
; colours: the colour theme's X resources (bin/theme), these the fallback
[bar/main]
; as tall as bin/x-run's dmenu (height 40); .Xresources' Xft.dpi, polybar's own being 96
dpi = 192
height = 40
background = ${xrdb:theme.bg:#000000}
foreground = ${xrdb:theme.grey:#888888}
font-0 = Iosevka:size=11;4
modules-left = bspwm
modules-right = status tray
; off the HONOR panel's rounded corners
; ponytail: guessed for this panel's radius; tune by eye if the edges still clip
padding-left = 40px
padding-right = 40px
module-margin = 1
wm-restack = bspwm

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-foreground = ${xrdb:theme.fg:#ffffff}
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${xrdb:theme.green:#00cd00}
label-urgent-padding = 1
label-empty =

[module/status]
type = custom/script
exec = x-status
tail = true

[module/tray]
type = internal/tray
tray-spacing = 5
