<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- dotfiles: what Iosevka lacks, the emoji above all, from Noto Color Emoji first, not the monochrome
     Noto Sans Symbols2 fontconfig would reach for (kitty, GTK). Linked to
     ~/.config/fontconfig by install. The terminal's is the Nerd Font build (config/kitty/theme.conf), the apps'
     Ubuntu's plain Iosevka, so both prefer the same emoji. -->
<fontconfig>
  <alias binding="same">
    <family>Iosevka</family>
    <prefer>
      <family>Iosevka</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>IosevkaTerm Nerd Font Mono</family>
    <prefer>
      <family>IosevkaTerm Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
