<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- dotfiles: what Iosevka lacks, the emoji above all, from Noto Color Emoji first, not the monochrome
     Noto Sans Symbols2 fontconfig would reach for (alacritty, i3bar's pango, dmenu). Linked to
     ~/.config/fontconfig by install. -->
<fontconfig>
  <alias binding="same">
    <family>Iosevka</family>
    <prefer>
      <family>Iosevka</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
