<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- dotfiles: what Iosevka lacks, the emoji above all, from Noto Color Emoji first, not the monochrome
     Noto Sans Symbols2 fontconfig would reach for (terminals, GTK). Linked to
     ~/.config/fontconfig by install. The terminal's is the Nerd Font build (config/hst/config.h), the apps'
     Ubuntu's plain Iosevka, so both prefer the same emoji. -->
<fontconfig>
  <alias binding="same">
    <family>Iosevka</family>
    <prefer>
      <family>Iosevka</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>IosevkaTerm Nerd Font Mono</family>
    <prefer>
      <family>IosevkaTerm Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <match target="font">
    <test name="family"><string>Fixedsys Excelsior</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="family"><string>Cozette</string></patelt>
      </pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
