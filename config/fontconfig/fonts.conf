<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>wmenu</string></test>
    <test qual="first" name="family"><string>Terminus</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="family"><string>Cozette</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Ttyp0 OTB</string></patelt>
      </pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
