<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Chimera packages the Nerd Font build of JetBrains Mono. -->
  <alias>
    <family>JetBrains Mono</family>
    <accept><family>JetBrainsMonoNL Nerd Font Mono</family></accept>
  </alias>
  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="family"><string>Cozette</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Ttyp0 OTB</string></patelt>
      </pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
