# GTK3 outside GNOME reads no color-scheme, only this: adw-gtk3, libadwaita's look for GTK3 (install puts it in
# ~/.local/share/themes), in its dark variant: built on the named colours gtk.css sets, so the file dialogs
# (xdg-desktop-portal-gtk), virt-manager and the rest are black, white and grey.
# Linked to ~/.config/gtk-3.0 by install.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
