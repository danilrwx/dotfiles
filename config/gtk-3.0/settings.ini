# GTK3 outside GNOME reads no color-scheme, only this: Adwaita, which GTK3 carries built in, in its dark
# variant ("Adwaita-dark" as a name needs gnome-themes-extra), for the file dialogs (xdg-desktop-portal-gtk),
# virt-manager and the rest. Linked to ~/.config/gtk-3.0 by install.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
