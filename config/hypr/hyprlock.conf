# hyprlock: the lock bin/x-lock and hypridle (config/hypr/hypridle.conf) run, on the theme's ground: black, with
# the white text.
$background = rgba(000000ff)
$foreground = rgba(ffffffff)

general {
    hide_cursor = true
}

background {
    monitor =
    color = $background
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = $background
    outer_color = $foreground
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = true
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 64
    font_family = IosevkaTerm Nerd Font Mono
    position = 0, 120
    halign = center
    valign = center
}
