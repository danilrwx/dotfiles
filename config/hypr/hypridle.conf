# hypridle: the idle and the sleep, what swayidle did — lock at 10 min, screens off at 15, lock before sleep.
# The lock is hyprlock (config/hypr/hyprlock.conf). Linked to ~/.config/hypr by install.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
