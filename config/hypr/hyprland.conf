# dotfiles: Hyprland, the session (tuigreet starts it, its package's /usr/share/wayland-sessions/hyprland.desktop):
# my i3 window keys and rules, dwindle with the split kept (super+v and super+c pick where the next window opens);
# the panel at 2x and the 240 Hz monitor at 1.5x, each its own; X apps (Steam) at the panel's real resolution,
# scaling themselves. The colours come from bin/theme, sourced below. Linked to ~/.config/hypr by install.

$mod = SUPER
$term = x-term

# the screens, matched by their EDID description (desc:, a prefix of it, case-sensitive) rather than the
# connector's name, so a monitor keeps its scale and its place whichever port it is plugged into; the name
# in the comment is only today's. The panel at 2x (1560x1040 logical), the 240 Hz monitor at 1.5x with its
# left edge at the panel's 1560 logical pixels. This Hyprland rounds a fractional scale to one where the
# logical size comes out whole, so the 1.5 lands on 1.6: 1600x1000. Anything else at 2x
monitor = desc:EDO EDO14.55, 3120x2080@120, 0x0, 2      # eDP-1
monitor = desc:BOE Display, 2560x1600@240, -1600x0, 1.6  # DP-1
monitor = , preferred, auto, 2

# X apps at the panel's resolution rather than 1x blown up, so they scale themselves: Steam's UI by its own env
# (and Xft.dpi, .Xresources merged below), the rest by those two
xwayland {
  force_zero_scaling = true
}
env = STEAM_FORCE_DESKTOPUI_SCALING,2
# the cursor at 24 for all: logical on Wayland, and Steam (reading these over .Xresources) doubles it itself
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# the session's environment to systemd and D-Bus: the portals (picked by XDG_CURRENT_DESKTOP), ssh-agent's askpass
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP=Hyprland
# X apps' scale through Xwayland: .Xresources's Xft.dpi 192 (the cursor stays 24 there, Steam doubles it)
exec-once = xrdb -merge $HOME/.Xresources
# the background (bin/x-bg: the theme's ground, or the wallpaper while the terminal's opacity shows it)
exec-once = $HOME/dotfiles/bin/x-bg
# the daemons, the X session's too: the lock at 10 min idle and before sleep, the screens off at 15 and on at the
# first input (dpms through hyprctl, the IPC this session has); the night light; the polkit agent's password
# prompts; the low battery cards (bin/x-status). Notifications are dunst's systemd user unit already
exec-once = swayidle -w timeout 600 x-lock timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep x-lock
exec-once = wlsunset -s 21:00 -S 07:00 -t 4500 -T 6500 -d 60
exec-once = lxpolkit
exec-once = x-status bar > /dev/null 2>&1

# look ────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# i3's: no gaps, a 1px border, green on the focused window; games may tear (their windowrule below), a frame to the
# screen at once rather than at the next vblank
general {
  gaps_in = 0
  gaps_out = 0
  border_size = 1
  col.active_border = rgb(23fd00)
  col.inactive_border = rgb(000000)
  layout = dwindle
  allow_tearing = true
}
# the theme's colours over the two above (bin/theme writes it, hyprctl reload reads it)
source = ~/.local/state/theme/hyprland.conf
# a fullscreen game straight to the screen, past the compositor (2: when its content says game, or a game's rule)
render {
  direct_scanout = 2
  # the newer frame scheduler: kept here so it survives a reload (a runtime keyword does not)
  new_render_scheduling = true
}
decoration {
  rounding = 0
  shadow {
    enabled = false
  }
  # nothing is see-through (no bar, no translucent panels): blur would only cost frames
  blur {
    enabled = false
  }
}
# animations, short: a window or workspace in about 100 ms (speed is in tenths of a second), sliding only between
# workspaces, nothing bouncing
animations {
  enabled = true
  bezier = quick, 0.2, 0, 0, 1
  animation = global, 1, 1, quick
  animation = windows, 1, 1, quick, popin 90%
  animation = fade, 1, 1, quick
  animation = layers, 1, 1, quick, fade
  animation = workspaces, 1, 1.5, quick, slide
  animation = border, 0
}
dwindle {
  preserve_split = true
}
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
  background_color = rgb(000000)
  # its dialogs (an app not responding, a permission asked) come from hyprland-guiutils, which the archive lacks:
  # the warning about it off, the dialogs going without
  disable_hyprland_guiutils_check = true
  # should the locker die while locked, a new one may take the lock over rather than the screen staying red
  allow_session_lock_restore = true
}

# input ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
# us and ru, Ctrl+Space between them (Caps as Ctrl is etc/udev/hwdb.d, below the keymap); the touchpad: no tap,
# natural scrolling, a click by the fingers down, off while typing, the adaptive pointer 0.4 slower, scrolling a
# third of libinput's
input {
  kb_layout = us,ru
  kb_options = grp:ctrl_space_toggle
  follow_mouse = 1
  sensitivity = -0.4
  touchpad {
    tap-to-click = false
    natural_scroll = true
    clickfinger_behavior = true
    disable_while_typing = true
    scroll_factor = 0.3
  }
}
# three fingers across the touchpad: the workspace beside, sliding after the fingers
gesture = 3, horizontal, workspace

# keys ────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# the media and HONOR Fn keys as dunst cards (bin/x-fnkeys), held they repeat; Hyprland delivers a grabbed key to
# the client only when focus is elsewhere, and these fire otherwise
bindel = , XF86AudioRaiseVolume, exec, x-fnkeys vol-up
bindel = , XF86AudioLowerVolume, exec, x-fnkeys vol-down
bindl  = , XF86AudioMute, exec, x-fnkeys vol-mute
bindel = $mod, XF86AudioRaiseVolume, exec, x-fnkeys mic-up
bindel = $mod, XF86AudioLowerVolume, exec, x-fnkeys mic-down
bind   = $mod SHIFT, M, exec, x-fnkeys mic
bindl  = , XF86AudioMicMute, exec, x-fnkeys mic
bindel = , XF86MonBrightnessDown, exec, x-fnkeys bright-down
bindel = , XF86MonBrightnessUp, exec, x-fnkeys bright-up
bind   = , XF86Launch1, exec, x-fnkeys profile
bind   = , XF86CameraAccessToggle, exec, x-fnkeys camera
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# the session's: the terminal, the launcher, the quick settings, the status, the lock, the screenshots, the
# notifications
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy -t image/png
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy -t image/png
bind = $mod, D, exec, x-run
bind = $mod, X, exec, x-ctl
bind = $mod, I, exec, x-status
bind = $mod, N, exec, dunstctl close
bind = $mod SHIFT, N, exec, dunstctl close-all
bind = $mod SHIFT, X, exec, x-lock
bind = $mod, Return, exec, x-term

# the window: close, and i3's direction keys; v and c preselect the split, e flips it, w groups as tabs
bind = $mod SHIFT, Q, killactive
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod, V, layoutmsg, preselect d
bind = $mod, C, layoutmsg, preselect r
bind = $mod, E, layoutmsg, togglesplit
bind = $mod, W, togglegroup
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod, SPACE, cyclenext, floating
# the two outputs, side by side
bind = $mod, period, focusmonitor, r
bind = $mod SHIFT, period, movewindow, mon:r
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ten workspaces, the last one back with super+Tab
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10
bind = $mod, TAB, workspace, previous

# the constants: reload, and exit behind a picker that names what it ends
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exec, sh -c 'printf "%s\n" exit cancel | $HOME/dotfiles/bin/x-menu "Exit Hyprland?" | grep -qx exit && hyprctl dispatch exit'

# the window's size by h/j/k/l, out by Return, Escape or super+r again
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , J, resizeactive, 0 40
binde = , K, resizeactive, 0 -40
binde = , L, resizeactive, 40 0
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
bind = $mod, R, submap, reset
submap = reset

# window rules ──────────────────────────────────────────────────────────────────────────────────────────────────────
# games: their frames shown at once (tearing allowed above), no vsync's frame of lag on the mouse
windowrule {
  name = games
  match:class = ^(dota2|cs2|steam_app_.*)$
  immediate = on
  # cs2 leaves its content type unset, and direct scanout refuses a surface that does not say game
  content = game
}
# i3's smart_borders: no border on a window alone on its workspace, tiled or fullscreen
windowrule {
  name = alone
  match:float = false
  match:workspace = w[tv1]
  border_size = 0
}
windowrule {
  name = fullscreen-alone
  match:float = false
  match:workspace = f[1]
  border_size = 0
}
# Telegram on 9 and Discord on 10; the dialogs of a running Steam float, as its client menu does
windowrule {
  name = telegram
  match:class = (?i).*telegram.*
  workspace = 9
}
windowrule {
  name = discord
  match:class = (?i)^discord$
  workspace = 10
}
windowrule {
  name = steam-dialogs
  match:class = ^steam$
  match:title = negative:^Steam$
  float = yes
}
# the quick settings in a floating terminal, and ssh's askpass
windowrule {
  name = x-ctl
  match:class = ^x-ctl$
  float = yes
  size = 60% 70%
}
windowrule {
  name = askpass
  match:title = ^SSH Askpass$
  float = yes
}
# Chrome's "… is sharing your screen." bar (a window of its own, no class) out of sight on a special workspace
windowrule {
  name = share-bar
  match:class = ^$
  match:title = ^.* is sharing (your screen|a window|a tab)\.$
  workspace = special:sharebar silent
}

plugin {
  csgo-vulkan-fix {
    res_w = 1280
      res_h = 960
      class = "SDL Application"
      fix_mouse = true
  }
}


