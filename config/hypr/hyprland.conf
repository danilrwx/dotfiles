# Hyprland, the Wayland session next to i3 and sway (tuigreet offers them all), config/i3/config's keys and
# rules in Hyprland's words: dwindle with the split kept, the way i3's manual splits go ($mod+v and $mod+c pick
# where the next window goes). X apps (Steam) sharp at the panel's 2x: Xwayland at the real resolution, the
# apps scaling themselves. bin/wl-autostart starts the daemons. Linked to ~/.config/hypr by install.

$mod = SUPER
$term = alacritty
$fn = $HOME/dotfiles/bin/wm-fnkeys
# the lock screen, the Quickshell bar's (config/quickshell/Lock.qml)
$lock = quickshell ipc call lock lock

monitor = , preferred, auto, 2

# X apps at the panel's resolution rather than 1x blown up, so they scale themselves: Steam's own 2x
xwayland {
  force_zero_scaling = true
}
env = STEAM_FORCE_DESKTOPUI_SCALING,2

# once per session: notifications, polkit, idle/lock
exec-once = $HOME/dotfiles/bin/wl-autostart Hyprland
# X apps' scale through Xwayland, as under i3: .Xresources's Xft.dpi 192 (Steam scales its UI by it once
# force_zero_scaling hands it the real resolution) and Xcursor.size 48
exec-once = xrdb -merge $HOME/.Xresources
# the theme picked last (bin/theme: the wallpaper, the bar's and alacritty's see-through), then, under a
# wallpaper, another one at random, as i3 does on every start
exec-once = $HOME/dotfiles/bin/theme apply && $HOME/dotfiles/bin/theme shuffle
# night light as last chosen (the quick settings, wmd): on every start and reload, a reload dropping the shader
exec = $HOME/go/bin/wmd night apply

# look ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# i3's: no gaps, a 1px border, green on the focused window
general {
  gaps_in = 0
  gaps_out = 0
  border_size = 1
  col.active_border = rgb(00cd00)
  col.inactive_border = rgb(000000)
  layout = dwindle
}
decoration {
  rounding = 0
  shadow {
    enabled = false
  }
  # blur, for the bar's layers alone (the rule below): a frosted ground under the see-through panel
  blur {
    enabled = true
    size = 12
    passes = 4
  }
}
# animations, short: a window or workspace in about 100 ms (speed is in tenths of a second), sliding only
# between workspaces, nothing bouncing
animations {
  enabled = true
  bezier = quick, 0.2, 0, 0, 1
  animation = global, 1, 1, quick
  animation = windows, 1, 1, quick, popin 90%
  animation = fade, 1, 1, quick
  animation = layers, 1, 1, quick, fade
  animation = workspaces, 1, 1.5, quick, slide
  animation = border, 0
}
dwindle {
  preserve_split = true
}
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
  background_color = rgb(000000)
  # its dialogs (an app not responding, a permission asked) come from hyprland-guiutils, which the archive
  # lacks: the warning about it off, the dialogs going without
  disable_hyprland_guiutils_check = true
  # should the locker die while locked, a new one may take the lock over rather than the screen staying red
  allow_session_lock_restore = true
}

# input ────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# us and ru, Ctrl+Space between them (Caps as Ctrl is etc/udev/hwdb.d, below the keymap); the touchpad as
# /etc/X11/xorg.conf.d/30-touchpad.conf has it under i3: no tap, natural scrolling, a click by the fingers down,
# off while typing, X's ScrollPixelDistance 50 being libinput's 15 at 0.3
input {
  kb_layout = us,ru
  kb_options = grp:ctrl_space_toggle
  follow_mouse = 1
  sensitivity = -0.25
  touchpad {
    tap-to-click = false
    natural_scroll = true
    clickfinger_behavior = true
    disable_while_typing = true
    scroll_factor = 0.3
  }
}

# keys ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# levels as a dunst progress card, mute and the HONOR Fn keys as a card (bin/wm-fnkeys); held keys repeat
bindel = , XF86AudioRaiseVolume, exec, $fn vol-up
bindel = , XF86AudioLowerVolume, exec, $fn vol-down
bindl  = , XF86AudioMute, exec, $fn vol-mute
bindel = $mod, XF86AudioRaiseVolume, exec, $fn mic-up
bindel = $mod, XF86AudioLowerVolume, exec, $fn mic-down
bind   = $mod SHIFT, M, exec, $fn mic
bindl  = , XF86AudioMicMute, exec, $fn mic
bindel = , XF86MonBrightnessDown, exec, $fn bright-down
bindel = , XF86MonBrightnessUp, exec, $fn bright-up

# HONOR Fn keys (patch/hotkeys of the HONOR fork maps them)
bind = , XF86TouchpadOn, exec, $fn touchpad-on
bind = , XF86TouchpadOff, exec, $fn touchpad-off
bind = , XF86TouchpadToggle, exec, $fn touchpad-toggle
bind = , XF86Launch1, exec, $fn profile
bind = , XF86CameraAccessToggle, exec, $fn camera
bind = , Print, exec, $HOME/dotfiles/bin/screenshot-select

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mod SHIFT, S, exec, $HOME/dotfiles/bin/screenshot-select
bind = $mod, D, exec, quickshell ipc call launcher toggle
# the clipboard's history in the same line (cliphist): Enter copies an entry back, Delete drops it
bind = $mod SHIFT, V, exec, quickshell ipc call launcher clipboard
# the bar (config/quickshell): $mod+b flips it between docked and hidden, hidden it shows while Super is held
# (i3's bar mode hide). Super's own down and up, passed on (n) so every $mod combination still works; at the
# release Super is still among the held modifiers, hence SUPER on that one
bind = $mod, B, exec, quickshell ipc call bar toggle
bindn = , Super_L, exec, quickshell ipc call bar peek
bindrn = SUPER, Super_L, exec, quickshell ipc call bar unpeek
bind = $mod SHIFT, X, exec, $lock
# the quick settings (config/quickshell): Wi-Fi, Bluetooth, sound, power, VLESS, OpenVPN
bind = $mod, X, exec, quickshell ipc call panel ctl

bind = $mod, N, exec, dunstctl close
bind = $mod SHIFT, N, exec, dunstctl close-all

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# i3's split v and split h: where the next window opens; $mod+e flips the split, $mod+w groups as tabs
bind = $mod, V, layoutmsg, preselect d
bind = $mod, C, layoutmsg, preselect r
bind = $mod, E, layoutmsg, togglesplit
bind = $mod, W, togglegroup
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod, SPACE, cyclenext, floating

bind = $mod, TAB, workspace, previous
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exec, swaynag -t warning -m 'Exit Hyprland? This ends the session.' -B 'Yes, exit' 'hyprctl dispatch exit'

bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , J, resizeactive, 0 40
binde = , K, resizeactive, 0 -40
binde = , L, resizeactive, 40 0
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
bind = $mod, R, submap, reset
submap = reset

# window rules ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# no blur under windows (a see-through alacritty stays clear), only under rbar's panels, toasts and OSD, their
# wholly clear parts (a panel window's empty lower part) left alone; under the bar only where it is more than its
# own see-through black (0.65): the tab a panel grows out of, a hovered block, as grey as the panel
windowrule {
  name = no-blur
  match:class = .*
  no_blur = on
}
layerrule {
  name = rbar-blur
  match:namespace = ^(rbar-panel|rbar-calendar|rbar-toast|rbar-osd)$
  blur = on
  ignore_alpha = 0.2
  xray = on
}
layerrule {
  name = rbar-bar-blur
  match:namespace = ^rbar$
  blur = on
  ignore_alpha = 0.7
  xray = on
}
# i3's smart_borders: no border on a window alone on its workspace, tiled or fullscreen
windowrule {
  name = alone
  match:float = false
  match:workspace = w[tv1]
  border_size = 0
}
windowrule {
  name = fullscreen-alone
  match:float = false
  match:workspace = f[1]
  border_size = 0
}
windowrule {
  name = steam-dialogs
  match:class = ^steam$
  match:title = negative:^Steam$
  float = yes
}
windowrule {
  name = telegram
  match:class = (?i).*telegram.*
  float = yes
  border_size = 0
}
windowrule {
  name = askpass
  match:title = ^SSH Askpass$
  float = yes
}
