# pastel, the dotfiles' one theme: the 16 ANSI slots (soft, after Alabaster's), the ground black and the text
# white. nvim (config/nvim/plugin/colors.lua), tmux, fzf, bat and k9s take their colours from these slots; the
# apps that want hex get theirs next to their own config. Included by kitty.conf
background #000000
foreground #ffffff
cursor #ffffff
cursor_text_color #000000
selection_background #333333
selection_foreground #ffffff
color0 #1c1c1c
color1 #e0787a
color2 #8fcf7a
color3 #e3d98a
color4 #7aaee8
color5 #c991d6
color6 #6fc2c2
color7 #c8c8c8
color8 #6b6b6b
color9 #f09a9b
color10 #addf9c
color11 #efe6a8
color12 #9cc4f0
color13 #dbb0e4
color14 #93d4d4
color15 #ffffff
