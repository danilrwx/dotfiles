# kitty, the terminal under sway and i3: one instance, $mod+Return opens its windows. Picked over foot
# for touch_scroll_multiplier: sway slows the touchpad (scroll_factor) for every app, and kitty scales it back
# up for itself and for tmux, where foot dropped the small deltas (Wayland only: X11 gives kitty no touchpad
# precision). Font and colours as the old ghostty theme.

font_family      Iosevka NF
font_size        12
window_padding_width 5 8
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
# servers rarely carry kitty's terminfo; less/vim/tmux there break with TERM=xterm-kitty
term xterm-256color
# tmux hands its copies over as OSC 52 too
clipboard_control write-clipboard write-primary no-append
update_check_interval 0

# touchpad lines per scroll step, against sway's scroll_factor; tune together with config/sway/config
touch_scroll_multiplier 12.0

foreground #ffffff
background #000000
selection_foreground #000000
selection_background #b5d5ff
cursor #ffffff
color0  #000000
color8  #7f7f7f
color1  #cd0000
color9  #ff0000
color2  #00cd00
color10 #00ff00
color3  #cdcd00
color11 #ffff00
color4  #80a0ff
color12 #5c5cff
color5  #cd00cd
color13 #ff00ff
color6  #00cdcd
color14 #00ffff
color7  #e5e5e5
color15 #ffffff
