# kitty, the terminal. The 16 ANSI colours, ground, text, cursor and selection are in theme.conf beside this
# file: the one pastel palette nvim, tmux, fzf, bat and k9s take theirs from. What does not change with it is here.
include theme.conf

# the font config/kitty/theme.conf names, Iosevka Term Nerd Font, its Mono build, so an icon is one cell wide
font_family IosevkaTerm Nerd Font Mono
font_size 12
bold_font auto
italic_font auto
bold_italic_font auto

# the vertical padding only (6 above and below, none on the sides); nine thousand lines of scrollback, no bell,
# and a window closes at once, without the confirmation kitty asks by default
window_padding_width 6 0
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0

# opacity can follow a theme change on reload (background_opacity in theme.conf); kitty's default does not allow it
dynamic_background_opacity yes
