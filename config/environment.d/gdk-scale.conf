# GTK at the panel's 2x as whole windows, not only their text: Xft.dpi 192 (.Xresources) doubles the fonts
# alone, so icons, padding and buttons stayed 1x (askpass, the portal's file chooser, virt-manager).
# GDK_SCALE doubles everything, GDK_DPI_SCALE takes the fonts back so they are not doubled twice. Linked to
# ~/.config/environment.d by install --desktop and read by systemd --user alone, for what it starts: askpass
# through ssh-agent, the portal's dialogs. .profile leaves it out of the session: Chrome and Electron apps
# take GDK_SCALE on top of Xft.dpi and come out at 4x.
GDK_SCALE=2
GDK_DPI_SCALE=0.5
