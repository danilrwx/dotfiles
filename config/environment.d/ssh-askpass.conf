# ssh clients without a terminal (git from GUI apps, editors, agents) ask for the key passphrase through
# OpenSSH's GTK3 askpass (ssh-askpass-gnome) instead of the missing /usr/bin/ssh-askpass; with a terminal
# ssh still asks there. Linked to ~/.config/environment.d by install, read at login.
SSH_ASKPASS=/usr/lib/openssh/gnome-ssh-askpass
