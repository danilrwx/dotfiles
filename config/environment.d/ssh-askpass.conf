# ssh asks for the key's passphrase through bin/x-askpass (OpenSSH's GTK3 one) instead of the missing /usr/bin/ssh-askpass, in a terminal too (prefer): the first use of a key, before
# AddKeysToAgent has it in the agent, gets the same dialog as the agent's confirm after. Without a display (a
# console, ssh into here) ssh still asks on the terminal. Linked to ~/.config/environment.d by install, read at
# login.
SSH_ASKPASS=${HOME}/dotfiles/bin/x-askpass
SSH_ASKPASS_REQUIRE=prefer
