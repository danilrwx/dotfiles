# the cursor's theme and size for the apps that read them from the environment alone (Steam), as .Xresources has
# them; the 2x of GTK, Chrome and Electron is the toolkit's own (gsettings, Chrome's --force-device-scale-factor),
# not GDK_SCALE here. Linked to ~/.config/environment.d by install, read at login.
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=48
