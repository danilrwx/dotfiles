# GTK3 at 2x on the HONOR's panel: GDK_SCALE doubles the widgets, icons and padding, which Xft.dpi 192
# (.Xresources) leaves at 1x, and GDK_DPI_SCALE halves the fonts back, Xft.dpi already doubling them; askpass,
# the polkit agent, virt-manager. Linked to ~/.config/environment.d by install, read at login.
GDK_SCALE=2
GDK_DPI_SCALE=0.5
# the cursor's theme and size for the apps that read them from the environment alone (Steam), as .Xresources has
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=48
