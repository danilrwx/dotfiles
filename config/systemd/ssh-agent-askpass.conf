# Drop-in for the systemd user ssh-agent.service (openssh-client), linked by
# install to ~/.config/systemd/user/ssh-agent.service.d/askpass.conf. The unit
# already sets SSH_ASKPASS_REQUIRE=force; this points it at OpenSSH's own GTK3
# askpass (ssh-askpass-gnome), which also does the per-use confirm dialog.
[Service]
Environment=SSH_ASKPASS=/usr/lib/openssh/gnome-ssh-askpass
