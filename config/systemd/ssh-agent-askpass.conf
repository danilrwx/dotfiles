# Drop-in for the systemd user ssh-agent.service (openssh-client), linked by
# install to ~/.config/systemd/user/ssh-agent.service.d/askpass.conf. The unit
# already sets SSH_ASKPASS_REQUIRE=force; this points it at bin/askpass (ostrov's,
# OpenSSH's GTK3 one where ostrov is not running), which also does the per-use
# confirm dialog.
[Service]
Environment=SSH_ASKPASS=%h/dotfiles/bin/askpass
