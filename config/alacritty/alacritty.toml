# alacritty, the terminal (in place of my st build): st's look carried over, Iosevka 12; black, white and grey as
# i3 has them; the colours from the theme in colors/ (bin/theme). Linked to ~/.config/alacritty by install.

[general]
live_config_reload = true
# the theme: a link to one of colors/ (its ground, text and ANSI colours), and its options over it (the ground
# black, the opacity), both set by bin/theme; nvim and Claude take their colours from these ANSI slots, so the
# theme is theirs too
import = ["~/.local/state/theme/alacritty.toml", "~/.local/state/theme/options.toml"]

[env]
# what ssh hosts and tmux know, alacritty's own terminfo being rare out there
TERM = "xterm-256color"

[window]
padding = { x = 2, y = 2 }
dynamic_padding = false
resize_increments = false

[font]
normal = { family = "Iosevka" }
size = 12

[scrolling]
history = 10000

[cursor]
style = { shape = "Block" }

[colors.cursor]
cursor = "#ffffff"
text = "#000000"
[colors.selection]
background = "#ffffff"
text = "#000000"
