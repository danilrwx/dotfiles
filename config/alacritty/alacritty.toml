# alacritty, the terminal (in place of my st build): st's look carried over, Iosevka 12; its colours and its
# see-through ostrov's, the bar's colour as solid as the bar (~/.local/state/ostrov/colors/alacritty.toml, written
# as ostrov's appearance and wallpaper change; a [colors] or window.opacity here would hold over them); alacritty
# reloads it, imports too, in every open window.
# Linked to ~/.config/alacritty by install.

[general]
import = ["~/.local/state/ostrov/colors/alacritty.toml"]
live_config_reload = true

[env]
# what ssh hosts and tmux know, alacritty's own terminfo being rare out there
TERM = "xterm-256color"

[window]
padding = { x = 2, y = 2 }
dynamic_padding = false
resize_increments = false

[font]
normal = { family = "Iosevka" }
size = 12

[scrolling]
history = 10000

[cursor]
style = { shape = "Block" }
