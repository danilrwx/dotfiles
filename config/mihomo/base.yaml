# mihomo, the VLESS client behind bin/vpn: the public part of its config. bin/vpn build merges the private
# part over it (private/config/mihomo/desktop.yaml: the servers under proxies, the subscriptions under
# proxy-providers) into ~/.config/mihomo/config.yaml, which mihomo.service runs.
#
# Started with TUN off and the rule mode; bin/vpn turns TUN on or off and switches rule/global at run time
# through the API below, no restart.

mixed-port: 7890          # the proxy mode: HTTP and SOCKS5 on one port
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
profile:
  store-selected: true    # the profile picked in bin/vpn survives a restart

# the TUN mode: every app's traffic, the DNS too, through mihomo
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
  # Russian names resolved by a Russian resolver, the rest over DoH
  default-nameserver:
    - 77.88.8.8
    - 1.1.1.1
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    "geosite:category-ru":
      - 77.88.8.8

geo-auto-update: true
geo-update-interval: 168

# the profile to go by: every server and every subscription's, picked in bin/vpn
proxy-groups:
  - name: PROXY
    type: select
    include-all: true

# the rule mode: the local networks and Russia direct, the rest through the profile
rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,category-ru,DIRECT
  - GEOIP,RU,DIRECT
  - MATCH,PROXY
