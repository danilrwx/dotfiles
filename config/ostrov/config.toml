# ostrov's config (~/w/ostrov, src/config.rs), linked to ~/.config/ostrov by install. A key left out keeps its
# default; the colours are taken as the file is saved, the rest at ostrov's start.

# the bar's blocks, left, middle and right: workspaces, clock, layout, tray, status
[bar]
left = ["workspaces"]
center = ["clock"]
right = ["layout", "tray", "status"]

# seconds without input to the lock, and to the screens off; 0 for never
[idle]
lock = 600
screens_off = 900

# any colour of the palette (src/style.rs) over its own: fg, dim, ink, accent, surface, hover, raised, card,
# well, sunk, rule, idle, urgent, ...
[colors]

# while a game's window has the focus, the power profile below; the one before back as it leaves
# (classes as Hyprland names windows; a trailing * a prefix)
[games]
classes = ["dota2", "cs2", "steam_app_*"]
profile = "performance"

[appearance]
blur_size = 3
opacity = 0.75
blur_passes = 1
theme = "dark"

[widget.wallpaper]
# bin/theme's see-through terminal and Chrome's colour follow ostrov's wallpaper
on_change = 'if [ -n "$OSTROV_WALLPAPER" ]; then ~/dotfiles/bin/theme dark-wall "$OSTROV_WALLPAPER"; else ~/dotfiles/bin/theme dark; fi'
