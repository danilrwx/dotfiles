# ostrov's config (~/w/ostrov, src/config.rs), linked to ~/.config/ostrov by install. A key left out keeps its
# default; the colours are taken as the file is saved, the rest at ostrov's start.

# the bar's blocks, left, middle and right: workspaces, clock, layout, tray, status
[bar]
left = ["workspaces"]
center = ["clock"]
right = ["privacy", "tray", "status"]

# the workspaces: GNOME's dots, the focused one a longer pill ("dots"); or i3's, a button each the bar's height
# ("numbers"), so many always there (past them those there are), named as names says (the first's first; one not
# named its number)
[bar.workspaces]
style = "dots"
count = 5
names = []

# seconds without input to the lock, and to the screens off; 0 for never
[idle]
lock = 600
screens_off = 900

# any colour of the palette (src/style.rs) over its own: fg, dim, ink, accent, surface, hover, raised, card,
# well, sunk, rule, idle, urgent, ...
[colors]

# while a game's window has the focus, the power profile below; the one before back as it leaves
# (classes as Hyprland names windows; a trailing * a prefix)
[launcher]
# g words to Google, ?question to Claude, in the browser
engines = { "g " = "https://www.google.com/search?q={}", "?" = "https://claude.ai/new?q={}" }

[plugin.night]
enabled = true

[plugin.record]
enabled = true

[plugin.displays]
enabled = true

[plugin.drives]
enabled = true
open_on_mount = false
automount = true

[plugin.updates]
enabled = true

[plugin.games]
enabled = true
classes = ["dota2", "cs2", "steam_app_*"]
profile = "performance"

[notifications]
games = ["dota2", "cs2", "steam_app_*"]

[appearance]
font = "Iosevka"
blur_size = 25
opacity = 0.9
blur_passes = 1
theme = "wallpaper"
blur = true
font_size = 9
bar_padding = 6
bar_spacing = 10
bar_height = 24
bar_icon_size = 12
density = "compact"
icon_size = 16
row_height = 40
surface = ""
radius = 10
bar_opacity = 0.85
sliders = "thin"
language = ""
tab = "auto"
blur_noise = 0.03
blur_xray = false
blur_vibrancy = 0.0
blur_contrast = 1.0
blur_brightness = 1.0
animations = true
blur_bar = false
mode = "dark"

[widget.wallpaper]
# bin/theme's see-through terminal and Chrome's colour follow ostrov's wallpaper
on_change = 'if [ -n "$OSTROV_WALLPAPER" ]; then ~/dotfiles/bin/theme dark-wall "$OSTROV_WALLPAPER"; else ~/dotfiles/bin/theme dark; fi'
interval = 25

[widget.keymap]
show = "flag"

[panels.control]
cols = 8

[panels.calendar]
cols = 6

# the lock screen over the screen as it was, blurred
[lock]
background = "blur"

[apps]
connected = ["hyprland", "fzf", "nvim"]
