# mono: black, white and grey, as i3 has them; config.yaml's skin
k9s:
  body: {fgColor: "#ffffff", bgColor: default, logoColor: "#61afef"}
  prompt: {fgColor: "#ffffff", bgColor: default, suggestColor: "#888888"}
  info: {fgColor: "#888888", sectionColor: "#ffffff"}
  dialog: {fgColor: "#ffffff", bgColor: default, buttonFgColor: "#000000", buttonBgColor: "#888888", buttonFocusFgColor: "#000000", buttonFocusBgColor: "#ffffff", labelFgColor: "#61afef", fieldFgColor: "#ffffff"}
  frame:
    border: {fgColor: "#888888", focusColor: "#ffffff"}
    menu: {fgColor: "#888888", keyColor: "#61afef", numKeyColor: "#c678dd"}
    crumbs: {fgColor: "#000000", bgColor: "#888888", activeColor: "#ffffff"}
    status: {newColor: "#61afef", modifyColor: "#e5c07b", addColor: "#98c379", pendingColor: "#e5c07b", errorColor: "#cd0000", highlightColor: "#56b6c2", killColor: "#888888", completedColor: "#888888"}
    title: {fgColor: "#ffffff", bgColor: default, highlightColor: "#61afef", counterColor: "#c678dd", filterColor: "#e5c07b"}
  views:
    charts: {bgColor: default, defaultDialColors: ["#61afef", "#e06c75"], defaultChartColors: ["#61afef", "#e06c75"]}
    table:
      fgColor: "#ffffff"
      bgColor: default
      cursorFgColor: "#000000"
      cursorBgColor: "#ffffff"
      markColor: "#e5c07b"
      header: {fgColor: "#888888", bgColor: default, sorterColor: "#ffffff"}
    xray: {fgColor: "#ffffff", bgColor: default, cursorColor: "#61afef", graphicColor: "#888888", showIcons: false}
    yaml: {keyColor: "#61afef", colonColor: "#888888", valueColor: "#ffffff"}
    logs:
      fgColor: "#ffffff"
      bgColor: default
      indicator: {fgColor: "#ffffff", bgColor: default, toggleOnColor: "#98c379", toggleOffColor: "#888888"}
