# picom, i3's compositor (bin/theme starts it under X11): drawn by the GPU (glx), in step with the screen
# (vsync), so ostrov's panels slide and its see-through grounds blend without the CPU; xcompmgr's place.
backend = "glx";
vsync = true;
use-damage = true;

# no shadows and no fades of picom's own: ostrov animates its panels itself
shadow = false;
fading = false;

# blur under ostrov's see-through surfaces alone (its bar, panels, toasts, dialogs), as Hyprland's layer rule
# does; every other window (alacritty's see-through, the root) left clear. The legacy options, not `rules`:
# picom 12 takes rules as replacing the legacy per-window options wholesale
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-exclude = [ "class_g != 'ostrov' && class_g != 'Ostrov' && class_g != 'dev.ostrov.Ostrov'" ];
