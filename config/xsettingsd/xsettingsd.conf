# XSETTINGS, as GNOME serves them at 200%, for the HONOR's 3120x2080 panel: GTK3 doubles its windows
# (WindowScalingFactor) and draws text at the unscaled 96 dpi times that, and Chromium and Electron (Chrome,
# Discord, Lolka) take the same 2x from these, where GDK_SCALE in the environment made them 4x on top of
# Xft.dpi. The cursor's theme and size too. bin/x-session starts it; linked to ~/.config/xsettingsd by install.
Gdk/WindowScalingFactor 2
Gdk/UnscaledDPI 98304
Xft/DPI 196608
Gtk/CursorThemeName "Adwaita"
Gtk/CursorThemeSize 48
