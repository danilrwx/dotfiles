set-option -g focus-events on

set -sg escape-time 0

set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

setw -q -g utf8 on

set -g mouse on

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 2     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 5      # redraw status line every 5s (status runs whoami + kubectl x2 + date each tick)

set -g history-limit 100000

set -g extended-keys on

set -g extended-keys-format csi-u

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

bind Enter copy-mode

bind-key v new-window "zsh -ic kctx"
bind-key V new-window "zsh -ic kns"

# OSC 52: tmux hands the copy buffer to the terminal emulator, which owns the
# real clipboard. Works over SSH with no X server (xclip/xsel/pbcopy cannot),
# so copy works the same in the docker and k8s devbox. terminal-features marks
# the outer terminal as clipboard-capable so tmux actually forwards OSC 52 out
# (set-clipboard alone only stores it in tmux's own buffer).
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
# Let apps in a pane pass an escape straight through to the outer terminal — the
# devbox `imgpaste` wraps its OSC 52 read query this way to reach the clipboard.
set -g allow-passthrough on
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set-option -g status-style bg=default

set -g status-justify absolute-centre
set -g window-status-format '#I #W#[fg=orange]#F'
set -g window-status-current-format '#[fg=red]#I #W#[fg=red]#F'

set -g status-left '#[fg=cyan]#(whoami)#[fg=magenta]@#{host_short}'
set -g status-left-length 100

set -g status-right '#[fg=cyan]#(kubectl config current-context 2>/dev/null):#[fg=magenta]#(kubectl config view --minify -o "jsonpath={..namespace}" 2>/dev/null | grep . || echo default) #[fg=orange]UTC:#(date -u +%%R)'
set -g status-right-length 100

# playbook: open it in an nvim split; <CR> there sends the line/selection to the
# shell below and runs it (see config/nvim/plugin/playbook.lua; was tome)
bind p split-window -c '#{pane_current_path}' -vb -l 12 "nvim $HOME/playbook.sh"

# kill the runaway foreground process in the current pane (was tmux-cowboy)
bind * run-shell 'p=$(ps -ao ppid=,pid= | awk -v n=#{pane_pid} "\$1==n{print \$2;exit}"); [ -n "$p" ] && kill -9 "$p"'

# fuzzy-extract a token from the pane via fzf (was extrakto):
# in the popup, Tab types it into the pane, Enter copies it to the clipboard
bind Tab display-popup -E -B -s 'bg=black' -w 80% -h 60% "$HOME/dotfiles/bin/tmux-extract"

# watch an agent's tmux session in a split pane via capture-pane polling, so it
# doesn't resize the agent's window (see bin/agent-watch); Ctrl-C stops it
bind A split-window -h "$HOME/dotfiles/bin/agent-watch"
