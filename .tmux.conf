set-option -g focus-events on

set -sg escape-time 0

set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# set -g default-terminal "xterm-kitty"
# set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors - needs tmux-3.0

setw -q -g utf8 on

set -g mouse on

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 2     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 1      # redraw status line every second

set -g history-limit 100000

set -g extended-keys on

set -g extended-keys-format csi-u

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

bind Enter copy-mode

bind-key v new-window "zsh -ic kctx"
bind-key V new-window "zsh -ic kns"

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

if-shell 'test "$(uname)" = "Darwin"' 'set -s copy-command "pb-copy"'
if-shell 'test "$(uname)" != "Darwin"' 'set -s copy-command "xsel -b"'

set-option -g status-style bg=default

set -g status-justify absolute-centre
set -g window-status-format '#I #W#[fg=orange]#F'
set -g window-status-current-format '#[fg=red]#I #W#[fg=red]#F'

set -g status-left '#[fg=cyan]#(whoami)#[fg=magenta]@#{host_short}'
set -g status-left-length 100

set -g status-right '#[fg=orange]#(cd "#{pane_current_path}"; b=$(git symbolic-ref --short HEAD 2>/dev/null) || exit 0; git diff --quiet --ignore-submodules 2>/dev/null || b="$b*"; echo "$b ")#[fg=cyan]#(kubectl config current-context 2>/dev/null):#[fg=magenta]#(kubectl config view --minify -o "jsonpath={..namespace}" 2>/dev/null | grep . || echo default) #[fg=orange]UTC:#(date -u +%%R)'
set -g status-right-length 100

set -g @tome_playbook '~/playbook.sh'

set -g @plugin 'laktak/tome'
set -g @plugin 'laktak/extrakto'

set -g @plugin 'tmux-plugins/tmux-cowboy'

run '~/.tmux/plugins/tpm/tpm'
