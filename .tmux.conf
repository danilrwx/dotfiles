set-option -g focus-events on

set -sg escape-time 0

set -g default-terminal tmux-256color
# bash, the login shell (install), whatever $SHELL the server started under: a wrapper given first to a terminal
# can leave its own there, causing panes to run sh
if-shell 'test -x /usr/bin/bash' 'set -g default-shell /usr/bin/bash' 'if-shell "test -x /usr/local/bin/bash" "set -g default-shell /usr/local/bin/bash"'
# a client attaching from a new session brings its display, as tmux does DISPLAY: the panes after it copy
# (bin/clip) and show pictures there
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY LABWC_PID XDG_SESSION_TYPE XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP GDK_BACKEND QT_QPA_PLATFORM MOZ_ENABLE_WAYLAND"
# Foot supports RGB. Kernel consoles use their own terminfo capabilities.
set -s 'terminal-features[3]' 'foot*:RGB'
# Kitty graphics (pi/jcode inline images) travel through tmux as DCS passthrough
set -g allow-passthrough on

set -g mouse on

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 15     # one local kubeconfig read per refresh

set -g history-limit 100000

set -g extended-keys on

# 3.5+; older tmux (Ubuntu 24.04, older servers) would print "invalid option"
%if #{>=:#{version},3.5}
set -g extended-keys-format csi-u
%endif

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

bind Enter copy-mode
# vi keys in copy mode explicitly: tmux otherwise infers it from $EDITOR, which
# is not set in every environment tmux starts from
setw -g mode-keys vi

bind-key v new-window "bash -ic kctx"
bind-key V new-window "bash -ic kns"

# copy-pipe fills the tmux paste buffer and mirrors it to the desktop if available.
if-shell 'test -x ~/dotfiles/bin/clip' 'set -g copy-command "~/dotfiles/bin/clip --desktop"'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

set -g status-justify absolute-centre
set -g window-status-format '#I #W#F'
set -g window-status-current-format '#I #W#F'

set -g status-left '#{USER}@#{host_short}'
set -g status-left-length 100

set -g status-right "#(kubectl config view --minify -o 'go-template={{index . \"current-context\"}}:{{with (index .contexts 0).context.namespace}}{{.}}{{else}}default{{end}}' 2>/dev/null || printf 'none:default') UTC:#(date -u +%%R)"
set -g status-right-length 100

# Use the terminal's default text and background in the status line.
set -g status-style "bg=default,fg=default"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=default"
set -g message-style "reverse"
set -g mode-style "fg=colour0,bg=colour12,noreverse"
set -g display-panes-active-colour "colour12"
set -g display-panes-colour "colour8"
set -g clock-mode-colour "colour12"  # "default" draws the digits invisible

# playbook: open it in a Vim split; <CR> there sends the line/selection to the
# shell below and runs it (see experiments/vim/vimrc)
bind p split-window -c '#{pane_current_path}' -vb -l 12 "vim $HOME/playbook.sh"

# kill the runaway foreground process in the current pane (was tmux-cowboy)
bind * run-shell 'p=$(ps -ao ppid=,pid= | awk -v n=#{pane_pid} "\$1==n{print \$2;exit}"); [ -n "$p" ] && kill -9 "$p"'

# fuzzy-extract a token from the pane via fzf (was extrakto):
# in the popup, Tab types it into the pane, Enter copies it to the clipboard
bind Tab display-popup -E -B -s 'bg=black' -w 80% -h 60% "$HOME/dotfiles/bin/tmux-extract"

# watch an agent's tmux session in a split pane via capture-pane polling, so it
# doesn't resize the agent's window (see bin/tmux-agent-watch); Ctrl-C stops it
bind A split-window -h "$HOME/dotfiles/bin/tmux-agent-watch"

# mirror every letter binding above (prefix + copy-mode-vi tables) onto the
# Russian layout, so prefix+р/о/л/д, н in copy mode etc. work without switching
# (see bin/tmux-ru-keys); keep this last so it sees all the bindings
run-shell "$HOME/dotfiles/bin/tmux-ru-keys"

# OpenRig managed block
set -g mouse on
set -g history-limit 10000
# End # OpenRig managed block

# duet: zoom the current pane, return to the previous pane and unzoom
bind -n M-z resize-pane -Z
bind -n M-e select-pane -l
