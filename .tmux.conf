set-option -g focus-events on

set -sg escape-time 0

set -g default-terminal "xterm-256color"
# zsh, the login shell (install), whatever $SHELL the server started under: a wrapper given first to a terminal
# leaves its own there (foot set it to /bin/sh), and every pane ran sh
set -g default-shell /usr/bin/zsh
# a client attaching from a new sway session brings its display and sway's socket, as tmux does DISPLAY: the
# panes after it copy (bin/clip, wl-copy) and set the theme live (bin/theme, swaymsg) there
set -ga update-environment ' WAYLAND_DISPLAY SWAYSOCK'
# truecolor for whatever the outer terminal is, whatever TERM it reports
set -as terminal-features ',*:RGB'

set -g mouse on

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 5      # redraw status line every 5s (status runs whoami + kubectl x2 + date each tick)

set -g history-limit 100000

set -g extended-keys on

# 3.5+; older tmux (Ubuntu 24.04, older servers) would print "invalid option"
%if #{>=:#{version},3.5}
set -g extended-keys-format csi-u
%endif

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

bind Enter copy-mode
# vi keys in copy mode explicitly: tmux otherwise infers it from $EDITOR, which
# is not set in every environment tmux starts from
setw -g mode-keys vi

bind-key v new-window "zsh -ic kctx"
bind-key V new-window "zsh -ic kns"

# copies go straight to the desktop clipboard through copy-command (bin/clip, wl-copy):
# the mouse drag and double-click defaults already use copy-pipe, y is rebound to it too
if-shell 'test -x ~/dotfiles/bin/clip' 'set -g copy-command "~/dotfiles/bin/clip"'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

set-option -g status-style bg=default

set -g status-justify absolute-centre
set -g window-status-format '#I #W#F'
set -g window-status-current-format '#I #W#F'

set -g status-left '#(whoami)@#{host_short}'
set -g status-left-length 100

set -g status-right '#(kubectl config current-context 2>/dev/null):#(kubectl config view --minify -o "jsonpath={..namespace}" 2>/dev/null | grep . || echo default) UTC:#(date -u +%%R)'
set -g status-right-length 100

# the terminal's text, grey (bright black) and its ground (status, borders, messages): its ANSI slots and
# defaults, so they follow the colour theme (bin/theme)
set -g status-style "bg=default,fg=colour8"
set -g window-status-style "fg=colour8"
set -g window-status-current-style "fg=default,bold"
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=default"
set -g message-style "reverse"
set -g mode-style "reverse"
set -g display-panes-active-colour "colour12"
set -g display-panes-colour "colour8"
set -g clock-mode-colour "colour12"  # "default" draws the digits invisible

# the colour theme: an fzf of them with a preview, in a popup (bin/theme pick)
bind T display-popup -E -w 80% -h 60% "$HOME/dotfiles/bin/theme pick"

# playbook: open it in an nvim split; <CR> there sends the line/selection to the
# shell below and runs it (see config/nvim/plugin/playbook.lua; was tome)
bind p split-window -c '#{pane_current_path}' -vb -l 12 "nvim $HOME/playbook.sh"

# kill the runaway foreground process in the current pane (was tmux-cowboy)
bind * run-shell 'p=$(ps -ao ppid=,pid= | awk -v n=#{pane_pid} "\$1==n{print \$2;exit}"); [ -n "$p" ] && kill -9 "$p"'

# fuzzy-extract a token from the pane via fzf (was extrakto):
# in the popup, Tab types it into the pane, Enter copies it to the clipboard
bind Tab display-popup -E -B -s 'bg=black' -w 80% -h 60% "$HOME/dotfiles/bin/tmux-extract"

# watch an agent's tmux session in a split pane via capture-pane polling, so it
# doesn't resize the agent's window (see bin/tmux-agent-watch); Ctrl-C stops it
bind A split-window -h "$HOME/dotfiles/bin/tmux-agent-watch"

# mirror every letter binding above (prefix + copy-mode-vi tables) onto the
# Russian layout, so prefix+р/о/л/д, н in copy mode etc. work without switching
# (see bin/tmux-ru-keys); keep this last so it sees all the bindings
run-shell "$HOME/dotfiles/bin/tmux-ru-keys"
